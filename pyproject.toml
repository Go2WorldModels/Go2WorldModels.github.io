[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-world-model"
version = "0.1.0"
description = "Forecast Go2 proprioception from joint commands at 50 Hz"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "numpy>=1.24", "safetensors>=0.4"]
authors = [{name = "Ramakrishna Kompella"}]

[project.optional-dependencies]
analysis = ["matplotlib>=3.6", "scipy>=1.10"]
hub = ["huggingface_hub>=0.26"]

[tool.setuptools]
packages = ["go2_world_model"]
